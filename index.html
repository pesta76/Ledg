<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081729"><title>LEDG</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(165deg,#4d3d20 0,#132c43 19%,#081729 58%);color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;min-height:100vh}.app{max-width:530px;margin:auto;padding:26px 19px 60px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#a9b9c8;font-size:13px}h1{font-size:24px;margin:0}h2{font-size:15px;margin:26px 0 14px;color:#b9c8d6}#balance{font-size:43px;font-weight:750;margin:20px 0 5px;letter-spacing:-1px}.positive{color:#43d59b}.negative{color:#ff7182}.change{font-size:16px}.chart{width:100%;height:185px;margin:16px 0 4px}.periods{display:flex;justify-content:space-between;gap:4px}.periods button{padding:9px 12px;border-radius:14px}.active{background:#d3aa51!important;color:#071728!important}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:25px}.action{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}.circle{height:57px;width:57px;border-radius:50%;background:#213b53;display:grid;place-items:center;color:#f1cb77;font-size:24px}button{border:0;background:#1b3349;color:#fff;padding:12px;border-radius:12px;font:inherit;cursor:pointer}.card{background:#142b40;border:1px solid #2b4256;border-radius:16px;padding:16px;margin:11px 0}.line{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px;color:#b6c5d4}.entry{border-bottom:1px solid #2c4356;padding:13px 0}.entry:last-child{border:0}.entry button{font-size:12px;padding:8px}.primary{background:#e0b75f;color:#101b27;font-weight:700;width:100%}dialog{border:1px solid #476078;border-radius:19px;background:#11283c;color:#fff;width:calc(100% - 28px);max-width:460px;padding:23px}dialog::backdrop{background:#000b}label{display:block;font-size:13px;color:#c5d2df;margin:14px 0 5px}input,select,textarea{width:100%;background:#081b2b;border:1px solid #476078;color:#fff;padding:12px;border-radius:9px;font:inherit}textarea{min-height:70px}.buttons{display:flex;gap:10px;margin-top:22px}.buttons button{flex:1}.hint{font-size:12px;color:#b5c5d4;margin-top:12px}</style></head><body><main class="app"><div class="top"><h1 id="title">LEDG</h1><button id="settings">⚙ Impostazioni</button></div><div class="muted" id="subtitle">Portafoglio personale</div><div id="balance">0,00 €</div><div class="change positive" id="change">+0,00% (+0,00 €)</div><svg class="chart" viewBox="0 0 350 185" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e4b44d" stop-opacity=".22"/><stop offset="1" stop-color="#e4b44d" stop-opacity="0"/></linearGradient></defs><path id="area" fill="url(#fade)"/><path id="curve" stroke="#e7b54e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="periods" id="periods"></div><div class="actions" id="actions"></div><div class="line"><h2>STORICO DELLE OPERAZIONI</h2><button id="add">+ Aggiungi</button></div><div id="history" class="card"></div><div class="buttons"><button id="export">Esporta dati</button><button id="import">Importa dati</button></div><input type="file" id="file" accept="application/json" hidden><p class="hint">I dati sono salvati su questo dispositivo. Usa Esporta dati per conservarne una copia: la modalità privata e la cancellazione dei dati del browser possono eliminarli.</p></main><dialog id="modal"><form id="form"><h2 id="modalTitle">Inserisci dati</h2><div id="fields"></div><div class="buttons"><button type="button" id="cancel">Annulla</button><button type="submit" class="primary">Salva</button></div></form></dialog><script>
const $=id=>document.getElementById(id),key='ledg-data-v1',types=['Acquisto','Vendita','Deposito','Prelievo','Guadagno','Perdita'],signs={Acquisto:1,Vendita:-1,Deposito:1,Prelievo:-1,Guadagno:1,Perdita:-1};let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}data=data&&Array.isArray(data.operations)?data:{name:'LEDG',subtitle:'Portafoglio personale',balance:null,percent:null,change:null,operations:[]};let edit=null,mode='operation',period='TUTTO';const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n),num=n=>Number(n)||0;function save(){localStorage.setItem(key,JSON.stringify(data));render()}function total(){return data.operations.reduce((s,o)=>s+num(o.amount)*signs[o.type],0)}function field(name,label,value='',type='text'){return '<label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+String(value??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')+'" '+(type==='number'?'step="any"':'')+'>'}function openSettings(){mode='settings';edit=null;$('modalTitle').textContent='Modifica tutte le caselle';$('fields').innerHTML=field('name','Nome portafoglio',data.name)+field('subtitle','Testo sotto il nome',data.subtitle)+field('balance','Valore principale in euro (vuoto = automatico)',data.balance,'number')+field('percent','Variazione percentuale (vuoto = automatica)',data.percent,'number')+field('change','Variazione in euro (vuoto = automatica)',data.change,'number');$('modal').showModal()}function openOperation(type='Acquisto',id=null){mode='operation';edit=id;const o=data.operations.find(x=>x.id===id);$('modalTitle').textContent=o?'Modifica operazione storica':'Nuova operazione';let options=types.map(t=>'<option '+((o?.type||type)===t?'selected':'')+'>'+t+'</option>').join('');$('fields').innerHTML='<label>Tipo di operazione</label><select name="type">'+options+'</select>'+field('amount','Importo (€)',o?.amount??'','number')+field('date','Data e ora',o?.date??new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16),'datetime-local')+'<label>Descrizione / nota</label><textarea name="note">'+(o?.note||'').replaceAll('&','&amp;').replaceAll('<','&lt;')+'</textarea>';$('modal').showModal()}$('cancel').onclick=()=>$('modal').close();$('settings').onclick=openSettings;$('add').onclick=()=>openOperation();$('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(mode==='settings'){data.name=f.get('name')||'LEDG';data.subtitle=f.get('subtitle')||'';for(const k of ['balance','percent','change'])data[k]=f.get(k)===''?null:Number(f.get(k))}else{const amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<0||!f.get('date'))return alert('Inserisci importo e data validi');const o={id:edit??Date.now()+Math.random(),type:f.get('type'),amount,date:f.get('date'),note:f.get('note')};if(edit!==null)data.operations=data.operations.map(x=>x.id===edit?o:x);else data.operations.push(o)}$('modal').close();save()};function render(){const calc=total(),balance=data.balance??calc,change=data.change??calc,percent=data.percent??(balance-change?change/Math.abs(balance-change)*100:0);$('title').textContent=data.name;$('subtitle').textContent=data.subtitle;$('balance').textContent=euro(balance);$('change').textContent=(change>=0?'+':'')+percent.toFixed(2).replace('.',',')+'% ('+(change>=0?'+':'')+euro(change)+')';$('change').className='change '+(change<0?'negative':'positive');$('periods').innerHTML=['1G','1S','1M','1A','TUTTO'].map(x=>'<button class="'+(period===x?'active':'')+'" data-period="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});$('actions').innerHTML=types.map((t,i)=>'<button class="action" data-type="'+t+'"><span class="circle">'+['↗','↘','+','−','↑','↓'][i]+'</span>'+t+'</button>').join('');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>openOperation(b.dataset.type));let ops=[...data.operations].sort((a,b)=>b.date.localeCompare(a.date));$('history').innerHTML=ops.length?ops.map(o=>'<div class="entry line"><div><b>'+o.type+'</b><div class="small">'+new Date(o.date).toLocaleString('it-IT')+'</div><div class="small" id="note-'+o.id+'"></div></div><div style="text-align:right"><b class="'+(signs[o.type]<0?'negative':'positive')+'">'+(signs[o.type]<0?'−':'+')+euro(o.amount)+'</b><div><button data-edit="'+o.id+'">Modifica</button> <button data-delete="'+o.id+'">Elimina</button></div></div></div>').join(''):'Nessuna operazione: premi + Aggiungi per inserire lo storico.';ops.forEach(o=>{const el=document.getElementById('note-'+o.id);if(el)el.textContent=o.note||''});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOperation('Acquisto',Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questa operazione?')){data.operations=data.operations.filter(o=>o.id!==Number(b.dataset.delete));save()}});draw()}function draw(){let now=Date.now(),days={'1G':1,'1S':7,'1M':30,'1A':365,'TUTTO':Infinity}[period],ops=[...data.operations].filter(o=>now-new Date(o.date).getTime()<=days*86400000).sort((a,b)=>a.date.localeCompare(b.date));let vals=[0],v=0;for(const o of ops){v+=num(o.amount)*signs[o.type];vals.push(v)}if(vals.length===1)vals.push(0);let lo=Math.min(...vals),hi=Math.max(...vals),range=hi-lo||1;const points=vals.map((y,i)=>[8+i*334/(vals.length-1),165-(y-lo)/range*135]);const d=points.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');$('curve').setAttribute('d',d);$('area').setAttribute('d',d+' L342 185 L8 185 Z')}$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledg-dati.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.operations))throw Error();if(confirm('Sostituire i dati attuali con quelli importati?')){data=v;save()}}catch{alert('File non valido')}};render();</script></body></html>
