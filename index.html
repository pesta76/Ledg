<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081729"><title>LEDG — Español</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(165deg,#4d3d20 0,#132c43 19%,#081729 58%);color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;min-height:100vh}.app{max-width:530px;margin:auto;padding:26px 19px 60px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#a9b9c8;font-size:13px}h1{font-size:24px;margin:0}h2{font-size:15px;margin:26px 0 14px;color:#b9c8d6}#balance{font-size:43px;font-weight:750;margin:20px 0 5px;letter-spacing:-1px}.positive{color:#43d59b}.negative{color:#ff7182}.change{font-size:16px}.chart{width:100%;height:185px;margin:16px 0 4px}.periods{display:flex;justify-content:space-between;gap:4px}.periods button{padding:9px 12px;border-radius:14px}.active{background:#d3aa51!important;color:#071728!important}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:25px}.action{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}.circle{height:57px;width:57px;border-radius:50%;background:#213b53;display:grid;place-items:center;color:#f1cb77;font-size:24px}button{border:0;background:#1b3349;color:#fff;padding:12px;border-radius:12px;font:inherit;cursor:pointer}.card{background:#142b40;border:1px solid #2b4256;border-radius:16px;padding:16px;margin:11px 0}.line{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px;color:#b6c5d4}.entry{border-bottom:1px solid #2c4356;padding:13px 0}.entry:last-child{border:0}.entry button{font-size:12px;padding:8px}.primary{background:#e0b75f;color:#101b27;font-weight:700;width:100%}dialog{border:1px solid #476078;border-radius:19px;background:#11283c;color:#fff;width:calc(100% - 28px);max-width:460px;padding:23px}dialog::backdrop{background:#000b}label{display:block;font-size:13px;color:#c5d2df;margin:14px 0 5px}input,select,textarea{width:100%;background:#081b2b;border:1px solid #476078;color:#fff;padding:12px;border-radius:9px;font:inherit}textarea{min-height:70px}.buttons{display:flex;gap:10px;margin-top:22px}.buttons button{flex:1}.hint{font-size:12px;color:#b5c5d4;margin-top:12px}.history-group{margin:18px 0 12px;background:#657e9e;border-radius:9px;padding:14px;font-size:13px;min-height:44px}.transaction{display:flex;gap:12px;align-items:center;padding:10px 2px 18px}.transaction-icon{width:44px;height:44px;border:1.5px solid #9fb4d1;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:24px}.transaction-info{flex:1;min-width:0}.transaction-info small{display:block;color:#cbd5e4;margin-top:3px}.transaction-value{text-align:right;font-weight:700;white-space:nowrap}.transaction-value small{display:block;margin-top:4px}.transaction-controls{text-align:right;margin-bottom:10px}.transaction-controls button{background:transparent;border:1px solid #526a83;font-size:12px;padding:7px}.history-more{width:100%;border:1px solid #91a3c2;border-radius:40px;background:transparent;margin:14px 0 25px}.transaction-value,.transaction-value small,.transaction-value div,#balance{color:#fff!important}.history-group{background:#8299b7;color:#fff;min-height:53px;display:flex;align-items:center;font-weight:650;font-size:14px}.transaction-info strong{color:#fff;font-weight:750}.transaction-info small{color:#fff}.transaction-value{font-size:16px}.transaction-value small{font-size:14px}.transaction-controls button{color:#dbe6f5}</style></head><body><main class="app"><div class="top"><h1 id="title">LEDG</h1><button id="settings">⚙ Configuración</button></div><div class="muted" id="subtitle">Cartera personal</div><div id="balance" role="button" tabindex="0" title="Toca para modificar el saldo" style="cursor:pointer">0,00 € ✎</div><div class="muted" style="margin-top:-2px">Toca el saldo para modificarlo</div><div class="change positive" id="change">+0,00% (+0,00 €)</div><svg class="chart" viewBox="0 0 350 185" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e4b44d" stop-opacity=".22"/><stop offset="1" stop-color="#e4b44d" stop-opacity="0"/></linearGradient></defs><path id="area" fill="url(#fade)"/><path id="curve" stroke="#e7b54e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="periods" id="periods"></div><div class="actions" id="actions"></div><div class="line"><h2>HISTORIAL DE TRANSACCIONES</h2><button id="add">+ Añadir</button></div><div id="history"></div><div class="buttons"><button id="export">Exportar datos</button><button id="import">Importar datos</button></div><input type="file" id="file" accept="application/json" hidden><p class="hint">I dati sono salvati su questo dispositivo. Usa Exportar datos per conservarne una copia: la modalità privata e la cancellazione dei dati del browser possono eliminarli.</p></main><dialog id="modal"><form id="form"><h2 id="modalTitle">Introducir datos</h2><div id="fields"></div><div class="buttons"><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></dialog><script>
const $=id=>document.getElementById(id),key='ledg-data-v1',types=['Compra','Venta','Depósito','Retirada','Ganancia','Pérdida'],signs={Compra:1,Venta:-1,Depósito:1,Retirada:-1,Ganancia:1,Pérdida:-1};let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}data=data&&Array.isArray(data.operations)?data:{name:'LEDG',subtitle:'Cartera personal',balance:null,percent:null,change:null,operations:[]};const legacy={Acquisto:'Compra',Vendita:'Venta',Deposito:'Depósito',Recibido:'Depósito',Prelievo:'Retirada',Guadagno:'Ganancia',Perdita:'Pérdida'};data.operations.forEach(o=>{o.type=legacy[o.type]||o.type});let edit=null,mode='operation',period='TODO';const euro=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n),num=n=>Number(n)||0;function save(){localStorage.setItem(key,JSON.stringify(data));render()}function total(){return data.operations.reduce((s,o)=>s+num(o.amount)*(signs[o.type]??1),0)}function field(name,label,value='',type='text'){return '<label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+String(value??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')+'" '+(type==='number'?'step="any"':'')+'>'}function openSettings(){mode='settings';edit=null;$('modalTitle').textContent='Editar todos los campos';$('fields').innerHTML=field('name','Nombre de la cartera',data.name)+field('subtitle','Texto debajo del nombre',data.subtitle)+field('balance','Saldo principal en euros (vacío = automático)',data.balance,'number')+field('percent','Variación porcentual (vacío = automática)',data.percent,'number')+field('change','Variación en euros (vacío = automática)',data.change,'number');$('modal').showModal()}function openOperation(type='Compra',id=null){mode='operation';edit=id;const o=data.operations.find(x=>x.id===id);$('modalTitle').textContent=o?'Editar operación del historial':'Nueva operación';let options=types.map(t=>'<option '+((o?.type||type)===t?'selected':'')+'>'+t+'</option>').join('');$('fields').innerHTML='<label>Tipo de operación</label><select name="type">'+options+'</select>'+field('amount','Importe (€)',o?.amount??'','number')+field('btc','Cantidad en BTC (opcional)',o?.btc??'','number')+field('group','Texto del recuadro gris (opcional)',o?.group??'')+field('date','Fecha y hora',o?.date??new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16),'datetime-local')+'<label>Descripción / nota</label><textarea name="note">'+(o?.note||'').replaceAll('&','&amp;').replaceAll('<','&lt;')+'</textarea>';$('modal').showModal()}$('cancel').onclick=()=>$('modal').close();$('settings').onclick=openSettings;$('balance').onclick=()=>{openSettings();setTimeout(()=>{const el=document.querySelector('[name=balance]');el?.focus();el?.select()},50)};$('balance').onkeydown=e=>{if(e.key==='Enter')$('balance').click()};$('add').onclick=()=>openOperation();$('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(mode==='settings'){data.name=f.get('name')||'LEDG';data.subtitle=f.get('subtitle')||'';for(const k of ['balance','percent','change'])data[k]=f.get(k)===''?null:Number(f.get(k))}else{const amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<0||!f.get('date'))return alert('Introduce un importe y una fecha válidos');const o={id:edit??Date.now()+Math.random(),type:f.get('type'),amount,date:f.get('date'),note:f.get('note'),btc:Number(f.get('btc'))||0,group:f.get('group')||''};if(edit!==null)data.operations=data.operations.map(x=>x.id===edit?o:x);else data.operations.push(o)}$('modal').close();save()};function render(){const calc=total(),balance=data.balance??calc,change=data.change??calc,percent=data.percent??(balance-change?change/Math.abs(balance-change)*100:0);$('title').textContent=data.name;$('subtitle').textContent=data.subtitle;$('balance').textContent=euro(balance);$('change').textContent=(change>=0?'+':'')+percent.toFixed(2).replace('.',',')+'% ('+(change>=0?'+':'')+euro(change)+')';$('change').className='change '+(change<0?'negative':'positive');$('periods').innerHTML=['1D','1S','1M','1A','TODO'].map(x=>'<button class="'+(period===x?'active':'')+'" data-period="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});$('actions').innerHTML=types.map((t,i)=>'<button class="action" data-type="'+t+'"><span class="circle">'+['↗','↘','+','−','↑','↓'][i]+'</span>'+t+'</button>').join('');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>openOperation(b.dataset.type));let ops=[...data.operations].sort((a,b)=>b.date.localeCompare(a.date));$('history').innerHTML=ops.length?ops.map((o,i)=>{const date=new Date(o.date),time=date.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),out=signs[o.type]<0,btc=Number(o.btc)||0,title=['Depósito','Deposito','Recibido','Deposit','Recibir'].includes(String(o.type).trim())?'Recibido':'Enviado';return '<div class="history-group" data-group="'+i+'"></div><div class="transaction"><span class="transaction-icon">'+(out?'↑':'↓')+'</span><div class="transaction-info"><strong>'+title+'</strong><small>'+title+' '+time+'</small></div><div class="transaction-value">'+(btc?'<div>'+(out?'-':'')+Math.abs(btc).toLocaleString('es-ES',{maximumFractionDigits:8})+' BTC</div>':'')+'<small>'+(out?'−':'+')+euro(o.amount)+'</small></div></div><div class="transaction-controls"><button data-edit="'+o.id+'">Editar</button> <button data-delete="'+o.id+'">Eliminar</button></div>'}).join('')+'<button class="history-more" id="viewAll">Ver todo</button>':'No hay transacciones. Pulsa + Añadir para introducir el historial.';ops.forEach((o,i)=>{const el=document.querySelector('[data-group="'+i+'"]');if(el)el.textContent=new Date(o.date).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'})+(o.group?' · '+o.group:'')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOperation('Compra',Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta operación?')){data.operations=data.operations.filter(o=>o.id!==Number(b.dataset.delete));save()}});const view=$('viewAll');if(view)view.onclick=()=>document.querySelector('#history').scrollIntoView({behavior:'smooth'});draw()}function draw(){let now=Date.now(),days={'1D':1,'1S':7,'1M':30,'1A':365,'TODO':Infinity}[period],ops=[...data.operations].filter(o=>now-new Date(o.date).getTime()<=days*86400000).sort((a,b)=>a.date.localeCompare(b.date));let vals=[0],v=0;for(const o of ops){v+=num(o.amount)*signs[o.type];vals.push(v)}if(vals.length===1)vals.push(0);let lo=Math.min(...vals),hi=Math.max(...vals),range=hi-lo||1;const points=vals.map((y,i)=>[8+i*334/(vals.length-1),165-(y-lo)/range*135]);const d=points.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');$('curve').setAttribute('d',d);$('area').setAttribute('d',d+' L342 185 L8 185 Z')}$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledg-datos.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.operations))throw Error();if(confirm('¿Sustituir los datos actuales por los importados?')){data=v;save()}}catch{alert('Archivo no válido')}};render();</script></body></html>
